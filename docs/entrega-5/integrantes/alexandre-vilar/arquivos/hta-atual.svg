<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">HTA do processo atual: obter informações e escolher uma empresa para vistoria</title>
<desc id="desc">Objetivo zero dividido em quatro tarefas: localizar orientações; compreender requisitos; localizar empresa credenciada; organizar informações. Cada tarefa possui três subtarefas.</desc>
