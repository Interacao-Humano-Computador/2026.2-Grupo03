site_name: INTERAÇÃO HUMANO COMPUTADOR | Grupo 03
site_description: Documentacao academica do projeto de Interacao Humano-Computador.
site_url: https://interacao-humano-computador.github.io/2026.2-Grupo03/
repo_url: https://github.com/Interacao-Humano-Computador/2026.2-Grupo03
repo_name: Interacao-Humano-Computador/2026.2-Grupo03
edit_uri: edit/main/docs/

validation:
  unrecognized_links: warn
  not_in_nav: ignore
  
theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Alternar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Alternar para o modo claro
  font:
    text: DM Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/steering

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - redirects:
      redirect_maps:
