site_name: INTERAÇÃO HUMANO COMPUTADOR | Grupo 03
site_description: Documentacao academica do projeto de Interacao Humano-Computador.
site_url: https://interacao-humano-computador.github.io/2026.2-Grupo03/
repo_url: https://github.com/Interacao-Humano-Computador/2026.2-Grupo03
repo_name: Interacao-Humano-Computador/2026.2-Grupo03
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Alternar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Alternar para o modo claro
  font:
    text: DM Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/steering

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - redirects:
      redirect_maps:
        # Página vazia criada em 06/10/2026 para a inspeção da Entrega 3; a inspeção foi feita no Grupo 07.
        'verificacao/grupo-06/index.md': 'verificacao/grupo-07/index.md'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Início:
    - Apresentação do projeto: index.md
    - Acompanhamento das entregas: acompanhamento/index.md
    - Relatórios das entregas:
      - Visão geral: relatorios/index.md
      - Entrega 1: relatorios/entrega-1.md
      - Entrega 2: relatorios/entrega-2.md
      - Entrega 3: relatorios/entrega-3.md
      - Entrega 4: relatorios/entrega-4.md
    - Apresentações e gravações: apresentacoes.md
    - Plano de Ensino: outros/plano de ensino/plano.md

  - Integrantes:
    - Visão geral: integrantes/index.md
    - Alexandre Vilar: integrantes/alexandre-vilar.md
    - Eduardo Ribeiro: integrantes/eduardo-ribeiro.md
    - Gabriel Robson: integrantes/gabriel-robson.md
    - Henrique Schneider: integrantes/henrique-schneider.md
    - João Vitor: integrantes/joao-vitor.md

